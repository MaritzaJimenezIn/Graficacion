<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graficador</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" 
      rel="stylesheet">

    
    <link rel="stylesheet" href="./style/index.css">
  </head>

  <body>

    
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Graficación</a>
      </div>
    </nav>

  
    <div class="container mt-4">

      <div class="card text-center">

        <div class="card-header">
          Graficador de funciones
        </div>

        <!-- controles -->
        <div class="card-body">

          <h5 class="card-title">Escribe tu función</h5>

          <div class="control-panel p-3 mb-4">

            <div class="row g-2 align-items-center">

              <div class="col-md-5">
                <input id="funcInput" type="text" class="form-control" 
                  placeholder="Ej: Math.sin(x), x*x">
              </div>

              <div class="col-md-2">
                <button id="drawBtn" class="btn btn-success w-100">
                  Graficar
                </button>
              </div>

              <div class="col-md-2">
                <button id="zoomIn" class="btn btn-primary w-100">
                  Zoom +
                </button>
              </div>

              <div class="col-md-2">
                <button id="zoomOut" class="btn btn-danger w-100">
                  Zoom -
                </button>
              </div>

              <div class="col-md-1 text-center">
                <input type="color" id="colorPicker" title="Color de la función">
              </div>

            </div>

            <div id="errorMsg" class="text-danger mt-2"></div>

          </div>

        </div>

        <!-- canvas -->
        <div class="chart card-img-bottom p-3">
          <canvas id="circlechart" width="500" height="500"></canvas>
        </div>

        <div class="card-footer text-muted">
          Área de dibujo
        </div>

      </div>

    </div>

    <!-- footer -->
    <footer id="footer" class="pb-4 pt-4 mt-4">
      <div class="container">
        <div class="row text-center">
          <div class="col">
            <a href="https://github.com/jorrgeCruz/graphics">Repositorio</a>
          </div>
          <div class="col">
            <a href="#">Contacto</a>
          </div>
          <div class="col">
            <a href="#">Estudiantes</a>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./dist/src/index.js" type="module"></script>

  </body>
</html>
